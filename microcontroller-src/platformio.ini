; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = kv4p_ht_esp32_wroom_32
default_envs = esp32dev, esp32dev-release, esp32s3, native-tests

[env:esp32dev]
build_type = debug
platform = espressif32 @ 6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
test_build_src = no
test_ignore = *
build_flags =
lib_deps =
    arduino-audio-tools=https://github.com/pschatzmann/arduino-audio-tools/archive/refs/tags/v1.2.3.zip
    https://github.com/pschatzmann/adpcm.git#v1.2.1
    dkaukov/esp32-afsk@0.1.4
    dkaukov/esp32-freedv2400b @ ^1.3.0

[env:esp32dev-release]
build_type = release
extends = env:esp32dev
build_unflags =
  -Os
build_flags =
  -DRELEASE=1
  -O3

[env:esp32s3]
extends = env:esp32dev
; PlatformIO 6.10.0 has no S3-Zero board definition. Use its ESP32-S3
; variant with the S3-Zero's 4 MB flash size.
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
build_flags =
  ${env:esp32dev.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3-release]
extends = env:esp32s3
build_type = release
build_unflags =
  -Os
build_flags =
  ${env:esp32s3.build_flags}
  -DRELEASE=1
  -O3

[env:native-tests]
build_type = test
platform = native
test_framework = unity
test_build_src = no
test_filter =
  test_kiss_protocol
  test_audio_codec
  test_freedv_squelch
  test_tx_audio_watchdog
  test_radio_module
  test_soft_squelch
build_flags =
  -DPIO_NATIVE_TEST=1
  -std=gnu++17
  -Ikv4p_ht_esp32_wroom_32
  -Itest/native_stubs
  -I.pio/libdeps/esp32dev/esp32-afsk/src
  -I.pio/libdeps/esp32dev/esp32-freedv2400b/src
lib_deps =
  https://github.com/dkaukov/esp-dsp.git#native-test
