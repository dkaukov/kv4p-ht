; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = kv4p_ht_esp32_wroom_32
default_envs = esp32dev, esp32dev-release, esp32s3, native-tests

[firmware]
lib_deps =
    arduino-audio-tools=https://github.com/pschatzmann/arduino-audio-tools/archive/refs/tags/v1.2.6.zip
    https://github.com/pschatzmann/adpcm.git#v1.2.1
    dkaukov/esp32-afsk@0.1.4
    dkaukov/esp32-freedv2400b @ ^1.3.0

[env:esp32dev]
build_type = debug
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
test_build_src = no
test_ignore = *
build_flags =
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=0
lib_ignore = BLE
lib_deps =
  ${firmware.lib_deps}
  h2zero/NimBLE-Arduino@2.5.1

[env:esp32dev-release]
build_type = release
extends = env:esp32dev
build_unflags =
  -Os
build_flags =
  ${env:esp32dev.build_flags}
  -DRELEASE=1
  -O3

[env:esp32s3]
extends = env:esp32dev
board = waveshare_esp32_s3_zero
; USB Serial/JTAG CDC uses Espressif's 303a:1001 device identity.
build_flags =
  ${env:esp32dev.build_flags}
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:native-tests]
build_type = test
platform = native
test_framework = unity
test_build_src = no
test_filter =
  test_kiss_protocol
  test_audio_codec
  test_freedv_squelch
  test_tx_audio_watchdog
  test_radio_module
  test_soft_squelch
build_flags =
  -DPIO_NATIVE_TEST=1
  -std=gnu++17
  -Ikv4p_ht_esp32_wroom_32
  -Itest/native_stubs
  -I.pio/libdeps/esp32dev/esp32-afsk/src
  -I.pio/libdeps/esp32dev/esp32-freedv2400b/src
lib_deps =
  https://github.com/dkaukov/esp-dsp.git#native-test
